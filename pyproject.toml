[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "court4"
version = "0.5.0"
description = "Upload-first pickleball performance analytics foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.111,<1.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.3,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.2,<9.0",
    "ruff>=0.5,<1.0",
]
detector = [
    "lap>=0.5.12,<0.6",
    "ultralytics>=8.3,<9.0",
]
spike = []

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that require optional local model weights or external detector dependencies",
    "postgres: tests that require the isolated Phase 1.8B0 PostgreSQL service",
    "production_postgres: tests that require the Phase 1.8B production PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["cv2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ultralytics"]
ignore_missing_imports = true
